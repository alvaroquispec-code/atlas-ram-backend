name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar
        run: mvn -B clean compile

      # La base de las pruebas la levanta Testcontainers en el Docker del runner (ver TestcontainersConfiguration).
      - name: Ejecutar tests
        run: mvn -B test
        env:
          JWT_SECRET: Q0lfc29sb19wYXJhX3Rlc3RzX25vX3VzYXJfZW5fcHJvZHVjY2lvbl8xMjM0
          PATIENT_KEY_SECRET: Q0lfc29sb19wYXJhX3Rlc3RzX2NsYXZlX2RlX3BhY2llbnRlXzAwMDE=


      - name: Empaquetar
        run: mvn -B package -DskipTests

      - name: Publicar resultados de tests
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: target/surefire-reports/
          if-no-files-found: ignore

  secrets-check:
    name: Verificar que no haya secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Buscar archivos sensibles
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$'; then
            echo "::error::Se detectaron archivos sensibles en el repositorio"
            exit 1
          fi
          echo "Sin archivos sensibles."
