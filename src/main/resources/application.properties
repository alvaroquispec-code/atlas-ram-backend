spring.application.name=atlas-ram-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/atlasram}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:atlasram}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:atlasram}

# El esquema lo crea y versiona Flyway; Hibernate solo verifica que coincida con las entidades.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
# En una base que ya tenía tablas (creadas antes con ddl-auto=update) se registra la versión 1
# sin ejecutar V1. En una base vacía se ejecutan todas las migraciones.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

breakpoints.standard=${BREAKPOINTS_STANDARD:CLSI}
breakpoints.version=${BREAKPOINTS_VERSION:2024}
server.servlet.context-path=/api/v1

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:noreply@atlasram.pe}
app.mail.enabled=${MAIL_ENABLED:false}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Detección de brotes por establecimiento (ver OutbreakDetector y AlertService).
# Ventana reciente de 4 semanas frente a la línea base de los 12 meses anteriores.
app.alert.window-days=28
app.alert.baseline-days=365
app.alert.alpha=0.0005
app.alert.min-resistant=4
app.alert.min-baseline-tested=20

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}
