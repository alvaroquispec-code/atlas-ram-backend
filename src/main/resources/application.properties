spring.application.name=atlas-ram-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/atlasram}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:atlasram}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:atlasram}

# El esquema lo crea y versiona Flyway; Hibernate solo verifica que coincida con las entidades.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
# En una base que ya tenía tablas (creadas antes con ddl-auto=update) se registra la versión 1
# sin ejecutar V1. En una base vacía se ejecutan todas las migraciones.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}

# Secreto (Base64, >= 32 bytes) para seudonimizar el identificador de paciente con HMAC-SHA256.
# Se guarda fuera del código, igual que JWT_SECRET. Si se pierde, los mismos pacientes tendrán claves nuevas.
app.patient-key.secret=${PATIENT_KEY_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

breakpoints.standard=${BREAKPOINTS_STANDARD:CLSI}
breakpoints.version=${BREAKPOINTS_VERSION:2024}
server.servlet.context-path=/api/v1

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:noreply@atlasram.pe}
app.mail.enabled=${MAIL_ENABLED:false}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Detección de brotes por establecimiento (ver OutbreakDetector y AlertService).
# Ventana reciente de 4 semanas frente a la línea base de los 12 meses anteriores.
app.alert.window-days=28
app.alert.baseline-days=365
app.alert.alpha=0.0005
app.alert.min-resistant=4
app.alert.min-baseline-tested=20

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# Límite de intentos fallidos de inicio de sesión (LoginAttemptLimiter)
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.max-failures-per-email=5
app.rate-limit.max-failures-per-ip=30
app.rate-limit.window-minutes=15
# Consultas sin sesión por IP y minuto (anti-scraping); 0 lo apaga.
app.rate-limit.public-per-minute=${API_RATE_LIMIT_PER_MINUTE:600}
# Detrás de CloudFront: secreto de la cabecera X-Origin-Verify (vacío = sin CloudFront).
app.cloudfront.origin-secret=${CLOUDFRONT_ORIGIN_SECRET:}

# Caché en memoria de las consultas públicas de agregados (CacheConfig). Se vacía con cada escritura
# correcta y, por si acaso, cada entrada vence a los 2 minutos. CACHE_TYPE=none la apaga.
spring.cache.type=${CACHE_TYPE:caffeine}
spring.cache.cache-names=antibiogram,referral,trend,wisca,byDistrict,published
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=120s,recordStats

# Verificación de correo (V20): usa el mismo SMTP de arriba (MAIL_ENABLED=true, MAIL_USERNAME, MAIL_PASSWORD,
# MAIL_FROM). Sin SMTP activo no se envía nada y nadie queda verificado (no hay atajos).
app.web-url=${APP_WEB_URL:https://atlas-ram-web.vercel.app}

# Cifrado por columna (FieldCipher). Si falta, se deriva de PATIENT_KEY_SECRET.
app.field-encryption.key=${FIELD_ENCRYPTION_KEY:}
