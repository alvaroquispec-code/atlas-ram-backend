spring.application.name=atlas-ram-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/atlasram}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:atlasram}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:atlasram}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

breakpoints.standard=${BREAKPOINTS_STANDARD:CLSI}
breakpoints.version=${BREAKPOINTS_VERSION:2024}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:noreply@atlasram.pe}
app.mail.enabled=${MAIL_ENABLED:false}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

app.alert.resistance-threshold=60.0