spring.application.name=atlas-ram-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/atlasram}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:atlasram}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:atlasram}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true