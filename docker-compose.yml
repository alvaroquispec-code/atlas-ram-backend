services:
  db:
    image: postgres:16-alpine
    container_name: atlasram-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlasram}
      POSTGRES_USER: ${POSTGRES_USER:-atlasram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlasram}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlasram}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: atlasram-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@atlasram.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
